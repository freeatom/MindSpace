<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px 8px 14px;
      border-radius: 40px;
      /* Professional Dark Glassmorphism */
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 0 0 1px rgba(16, 185, 129, 0.15) inset;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      opacity: 0;
      transform: translateY(6px) scale(0.95);
      transition: opacity 0.22s ease-out, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mic-ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .mic-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.5);
      animation: micPulse 1.4s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 0; }
    }
    .mic-ring svg {
      width: 13px;
      height: 13px;
      color: #10b981;
      filter: drop-shadow(0 0 4px rgba(16,185,129,0.4));
    }

    .pill-text {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    .pill-dots {
      display: inline-flex;
      gap: 2px;
      margin-left: -2px;
    }
    .pill-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .pill-dots span:nth-child(2) { animation-delay: 0.15s; }
    .pill-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotBounce {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    /* Waveform bars for listening state */
    .wave-bars {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 14px;
    }
    .wave-bars span {
      width: 2.5px;
      border-radius: 2px;
      background: rgba(16, 185, 129, 0.7);
      animation: waveBar 0.8s ease-in-out infinite;
    }
    .wave-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .wave-bars span:nth-child(2) { height: 10px; animation-delay: 0.1s; }
    .wave-bars span:nth-child(3) { height: 14px; animation-delay: 0.2s; }
    .wave-bars span:nth-child(4) { height: 8px; animation-delay: 0.3s; }
    .wave-bars span:nth-child(5) { height: 12px; animation-delay: 0.15s; }
    @keyframes waveBar {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    /* Timer */
    .pill-timer {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      font-variant-numeric: tabular-nums;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="mic-ring">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
    <div class="wave-bars" id="wave-bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span class="pill-text" id="pill-text">Listening</span>
    <span class="pill-dots" id="pill-dots"><span></span><span></span><span></span></span>
    <span class="pill-timer" id="pill-timer">0:00</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const pill = document.getElementById('pill');
    const pillText = document.getElementById('pill-text');
    const pillDots = document.getElementById('pill-dots');
    const pillTimer = document.getElementById('pill-timer');
    const waveBars = document.getElementById('wave-bars');

    let timerInterval = null;
    let startTime = null;

    function updateTimer() {
      if (!startTime) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      pillTimer.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    ipcRenderer.on('whispr-pill-state', (e, state) => {
      if (state === 'listening') {
        pillText.textContent = 'Listening';
        waveBars.style.display = 'flex';
        pillDots.style.display = 'none';
        pillTimer.style.display = '';
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        // Animate in
        pill.classList.remove('visible');
        void pill.offsetWidth;
        pill.classList.add('visible');
      } else if (state === 'transcribing') {
        pillText.textContent = 'Transcribing';
        waveBars.style.display = 'none';
        pillDots.style.display = 'inline-flex';
        pillTimer.style.display = 'none';
        clearInterval(timerInterval);
      } else if (state === 'done') {
        pill.classList.remove('visible');
        clearInterval(timerInterval);
        startTime = null;
      } else if (state === 'error') {
        pillText.textContent = 'Error';
        waveBars.style.display = 'none';
        pillDots.style.display = 'none';
        pillTimer.style.display = 'none';
        clearInterval(timerInterval);
        setTimeout(() => {
          pill.classList.remove('visible');
        }, 2000);
      }
    });
  </script>
</body>
</html>
